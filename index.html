<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthPad.net</title>
    <style>
        :root {
            --bg: #f9f9f9;
            --text: #333;
            --subtext: #666;
            --border: #ddd;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1a;
                --text: #eee;
                --subtext: #aaa;
                --border: #444;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: Georgia, serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 600px;
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: var(--text);
        }
        p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--subtext);
            margin-bottom: 1rem;
        }
        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 2rem auto;
            width: 60px;
        }
        .year {
            font-size: 0.9rem;
            color: var(--subtext);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HealthPad.net</h1>
        <hr>
        <p>HealthPad.net is no longer in business.</p>
        <p>Thank you to all our members and contributors for being part of our community.</p>

    </div>
</body>
</html>
